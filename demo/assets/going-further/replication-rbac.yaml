apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-replicator
  namespace: solar-development
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-replicator
  namespace: solar-development
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-replicator
  namespace: solar-production
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-replicator
  namespace: solar-development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-replicator
subjects:
  - kind: ServiceAccount
    name: config-replicator
    namespace: solar-development
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-replicator
  namespace: solar-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-replicator
subjects:
  - kind: ServiceAccount
    name: config-replicator
    namespace: solar-development
