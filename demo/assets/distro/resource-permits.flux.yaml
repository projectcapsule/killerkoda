---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: resource-permits
  namespace: flux-system
spec:
  type: oci
  interval: 5m0s
  url: oci://ghcr.io/projectcapsule/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: resource-permits
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 15s
  targetNamespace: capsule-system
  releaseName: resource-permits
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: resource-permits
      sourceRef:
        kind: HelmRepository
        name: resource-permits
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
  driftDetection:
    mode: disabled
  values:
