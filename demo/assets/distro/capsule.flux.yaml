---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: capsule
  namespace: flux-system
spec:
  type: oci
  interval: 5m0s
  url: oci://ghcr.io/projectcapsule/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capsule
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 15s
  targetNamespace: capsule-system
  releaseName: capsule
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: capsule
      sourceRef:
        kind: HelmRepository
        name: capsule
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
  driftDetection:
    mode: disabled
  values:
    proxy:
      enabled: true
      gangplank:
        enabled: true
        service:
          type: NodePort
          nodePort: 30442
        config:
          clusterName: "tenant-cluster"
          apiServerURL: "${PROXY_URL}"
          scopes:
            - "openid"
            - "profile"
            - "email"
            - "groups"
            - "offline_access"
          redirectURL: "${GANGPLANK_URL}/callback"
          usernameClaim: "email"
          clientID: "gangplank"
          clientSecret: "gangplank-secret"
          # KillerCoda terminates public HTTPS with a publicly trusted CA.
          removeCAFromKubeconfig: true
          authorizeURL: "${DEX_URL}/auth"
          tokenURL: "${DEX_URL}/token"
      certManager:
        generateCertificates: true
        certificate:
          ipAddresses:
            - 127.0.0.1
          dnsNames:
            - localhost
            - "${PROXY_HOST}"
      service:
        type: NodePort
        nodePort: 30443
      options:
        generateCertificates: false
        ignoredUsernames:
          - "admin"
        roleBindingReflector: true
        extraArgs:
          - "--feature-gates=ProxyClusterScoped=true"
    crds:
      install: true
    replicaCount: 2
    certManager:
      generateCertificates: false
    tls:
      enableController: true
      create: true
    manager:
      options:
        allowServiceAccountPromotion: true
        administrators:
          - kind: User
            name: "admin"
        users:
          - kind: Group
            name: "capsule-users"
        forceTenantPrefix: false
    rbac:
      breakrequests:
        create: true
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"
      resources:
        create: true
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"
      resourcepoolclaims:
        create: true
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"
      customquotas:
        create: true
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"

