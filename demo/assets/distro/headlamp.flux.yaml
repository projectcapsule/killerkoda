---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  releaseName: "headlamp"
  targetNamespace: capsule-system
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: capsule
    - name: dex
  chart:
    spec:
      chart: headlamp
      # Resource Permits and Change Windows require Headlamp >= 0.45.0.
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp-charts
      interval: 24h
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    replicaCount: 1
    automountServiceAccountToken: true
    service:
      type: NodePort
      port: 80
      targetPort: 4466
      nodePort: 30444
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    volumeMounts:
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: token-ca
    - name: ca-store
      mountPath: /etc/ssl/
    env:
      - name: KUBERNETES_SERVICE_HOST
        value: capsule-proxy.capsule-system.svc
      - name: KUBERNETES_SERVICE_PORT
        value: "9001"
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
      - name: ca-store
        emptyDir: {}
      - name: capsule-proxy
        secret:
          secretName: capsule-proxy
      - name: token-ca
        projected:
          sources:
              - serviceAccountToken:
                  path: token
              - secret:
                  name: capsule-proxy
                  items:
                      - key: ca.crt
                        path: ca.crt
              - downwardAPI: null
                items:
                  - fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
                    path: namespace
    initContainers:
      - name: add-ca
        image: docker.io/alpine:3
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -e
            cp -R /etc/ssl/* /work/
            cat /ca/ca.crt >> /work/certs/ca-certificates.crt
        volumeMounts:
          - name: ca-store
            mountPath: /work
          - name: capsule-proxy
            mountPath: /ca
        securityContext:
          capabilities:
              drop:
                  - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          runAsUser: 65534
          runAsGroup: 65534
    podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
            type: RuntimeDefault
    securityContext:
        capabilities:
            drop:
                - ALL
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false
        privileged: false
        runAsUser: 100
        runAsGroup: 101
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: capsule
            source: https://artifacthub.io/packages/headlamp/headlamp-capsule/capsule
            version: 0.3.1
          - name: change-windows
            source: https://artifacthub.io/packages/headlamp/change-windows-headlamp/change-windows
            version: 0.1.4
          - name: resource-permits
            source: https://artifacthub.io/packages/headlamp/resource-permits-headlamp/resource-permits
            version: 0.0.3
          - name: ssa-inspector
            source: https://artifacthub.io/packages/headlamp/buttah-headlamp-plugins/ssa-inspector
            version: 0.1.0
          - name: flux
            source: https://artifacthub.io/packages/headlamp/buttah-headlamp-plugins/flux
            version: 0.1.0
        installOptions:
          parallel: true
          maxConcurrent: 2
    config:
        pluginsDir: /build/plugins
        inCluster: true
        watchPlugins: true
        extraArgs:
          - -oidc-ca-file=/etc/ssl/certs/ca-certificates.crt
        oidc:
          clientID: kubernetes 
          clientSecret: kubernetes-secret 
          issuerURL: "${DEX_URL}"
          callbackURL: "${HEADLAMP_URL}/oidc-callback"
          scopes: "email,profile,groups"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp-charts
  namespace: flux-system
spec:
  interval: 24h0m0s
  url: https://kubernetes-sigs.github.io/headlamp/
